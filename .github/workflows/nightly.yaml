name: Nightly Ladybird Build

on:
  schedule:
    - cron: '0 2 * * *'  # 2am UTC nightly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Install dependencies
        run: |
          xcode-select --install || true
          brew install autoconf autoconf-archive automake ccache cmake \
            libtool nasm ninja pkg-config llvm@21

      - name: Clone Ladybird
        run: git clone https://github.com/LadybirdBrowser/ladybird.git

      - name: Build
        working-directory: ladybird
        run: |
          CC=$(brew --prefix llvm@21)/bin/clang \
          CXX=$(brew --prefix llvm@21)/bin/clang++ \
          ./Meta/ladybird.py build --release

      - name: Package .app
        run: |
          mkdir -p dist
          cp -r ladybird/Build/release/bin/Ladybird.app dist/ || \
          cp -r ladybird/Build/release/bin/Ladybird dist/
          cd dist && zip -r ../ladybird-macos-nightly.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-macos
          path: ladybird-macos-nightly.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang lld cmake ninja-build \
            git rustup pkg-config autoconf autoconf-archive automake nasm \
            qt6-base-dev qt6-tools-dev-tools qt6-wayland qt6-multimedia-dev \
            libgl1-mesa-dev libglu1-mesa

      - name: Clone Ladybird
        run: git clone https://github.com/LadybirdBrowser/ladybird.git

      - name: Build
        working-directory: ladybird
        run: ./Meta/ladybird.py build --release

      - name: Package binary
        run: |
          mkdir -p dist
          cp ladybird/Build/release/bin/Ladybird dist/
          cd dist && tar -czf ../ladybird-linux-nightly.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-linux
          path: ladybird-linux-nightly.tar.gz

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Get current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build ${{ env.DATE }}"
          body: |
            Automated nightly build of [LadybirdBrowser/ladybird](https://github.com/LadybirdBrowser/ladybird) main branch.
            
            **This is unofficial and unsupported. macOS users: right-click > Open to bypass Gatekeeper.**
            
            Built: ${{ env.DATE }}
          prerelease: true
          files: |
            ladybird-macos/ladybird-macos-nightly.zip
            ladybird-linux/ladybird-linux-nightly.tar.gz
